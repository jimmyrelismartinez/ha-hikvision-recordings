<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>app.js playback fallback tests</title></head>
<body class="view-all">
<!--
  Exercises the REAL hikvision_recordings/www/app.js — not a copy — against stubbed
  ffmpeg.wasm and fetch. What is being pinned:

    * the client path is skipped entirely (no raw fetch, no 32 MB core load) when
      it could never work: ffmpeg.wasm absent, or the clip too big for the heap
    * ANY client-side failure — load, HTTP, non-zero exit, empty output — lands on
      the existing server-side /api/stream, never on a dead player
    * the badge reports the path that actually ran, since that is the only way to
      tell them apart from a screenshot
    * the SD/HD choice reaches both paths, including the fallback

  Run via tests/frontend/run.py, which serves the repo and drives a real browser.
-->
<pre id="log"></pre>

<!-- The DOM app.js binds to at load. Ids must match www/index.html. -->
<nav><a href="#/" id="tab-cameras"></a><a href="#/all" id="tab-all"></a></nav>
<span id="status"></span>
<section id="view-home" hidden>
  <div id="recent-strip"></div>
  <p id="recent-empty" hidden></p>
  <div id="camera-tiles"></div>
</section>
<section id="view-camera" hidden>
  <a href="#/" id="camera-back"></a>
  <h2 id="camera-title"></h2>
  <button type="button" id="live-button" hidden>● Live</button>
  <button type="button" id="date-chip">Today</button>
  <input type="date" id="date-jump">
  <div id="event-filters" hidden></div>
  <button type="button" id="refresh-today"></button>
  <div id="vtimeline"></div>
  <div id="day-sentinel" hidden></div>
  <p id="camera-end" hidden></p>
  <button type="button" id="load-earlier" hidden></button>
</section>
<section id="view-all">
<form id="search-form">
  <div id="camera-chips"></div>
  <input type="date" id="date"><input type="time" id="from"><input type="time" id="to">
  <button type="submit" id="search-button"></button>
</form>
<p id="message"></p>
<div id="banners"></div><div id="timeline" hidden></div>
<ul id="results"></ul><button type="button" id="show-more" hidden></button>
</section>
<section id="player-panel" hidden>
  <span id="player-camera"></span><span id="player-time"></span>
  <button type="button" id="player-close"></button>
  <div id="stage-live" hidden>
    <img id="stage-image" alt="">
    <p id="stage-label"></p>
    <p id="stage-paused" hidden></p>
  </div>
  <div id="player-body"></div>
  <div class="player-nav">
    <button type="button" id="prev-clip"></button>
    <input type="checkbox" id="autoplay">
    <button type="button" id="next-clip"></button>
  </div>
</section>
<div id="cases"></div>

<script>
// ── stubs, installed before app.js runs ──────────────────────────────────────
window.__fetches = [];
window.__nextRawResponse = null;
window.__thumbInflightPeak = 0;
window.__snapshotStatus = {};  // cameraKey -> status (default 200)
window.__recordingsFor = null; // optional (url) => body override

// Preferences persist in the test browser profile — start every run clean.
try { localStorage.clear(); } catch (err) { /* ignore */ }

// Placeholder cameras only (privacy rule): never real names or addresses.
window.__recordings = { clips: [], truncated: false, truncated_cameras: [], errors: [] };

window.__aborted = [];
window.__rawDelay = 0;
window.__recordingsStatus = 200;
window.__thumbDelay = 0;
window.__thumbStatus = 200;

window.fetch = async (url, options) => {
  window.__fetches.push(String(url));
  if (String(url).startsWith('api/channels')) {
    return { ok: true, json: async () => [
      { id: 'dvr-101', key: 'dvr-101', name: 'Driveway', kind: 'dvr', snapshot: true },
      { id: 'reolink-0', key: 'reolink-0', name: 'Porch', kind: 'reolink', snapshot: false },
      { id: 'reolink-1', key: 'reolink-1', name: 'Garden', kind: 'reolink', snapshot: false },
    ] };
  }
  if (String(url).startsWith('api/health')) {
    return { ok: true, json: async () => ({
      dvr: 'ok',
      ha_api: 'ok',
      devices: [
        { prefix: 'dvr', kind: 'dvr', name: 'DVR', state: 'ok' },
        { prefix: 'reolink-0', kind: 'reolink', name: 'Porch', state: 'ok' },
        { prefix: 'reolink-1', kind: 'reolink', name: 'Garden', state: 'unreachable' },
      ],
    }) };
  }
  if (String(url).startsWith('api/recordings')) {
    if (typeof window.__recordingsFor === 'function') {
      const body = window.__recordingsFor(String(url));
      return { ok: true, status: 200, json: async () => body };
    }
    const status = window.__recordingsStatus;
    return { ok: status < 400, status,
             json: async () => (status < 400 ? window.__recordings : { detail: 'Search failed upstream.' }) };
  }
  if (String(url).startsWith('api/snapshot/')) {
    const key = String(url).split('?')[0].slice('api/snapshot/'.length);
    const status = window.__snapshotStatus[key] ?? 200;
    if (status >= 400) return { ok: false, status, blob: async () => new Blob() };
    return { ok: true, status: 200, blob: async () => new Blob([new Uint8Array([1,2,3])], { type: 'image/jpeg' }) };
  }
  if (String(url).startsWith('api/thumbnail/')) {
    window.__thumbInflightPeak = Math.max(window.__thumbInflightPeak, thumbInflight || 0);
    if (window.__thumbDelay) await new Promise((r) => setTimeout(r, window.__thumbDelay));
    const status = window.__thumbStatus;
    if (status === 410) {
      window.__thumbStatus = 200;
      return { ok: false, status: 410, blob: async () => new Blob() };
    }
    if (status >= 400) return { ok: false, status, blob: async () => new Blob() };
    return { ok: true, status: 200, blob: async () => new Blob([new Uint8Array([9,9])], { type: 'image/jpeg' }) };
  }
  if (String(url).startsWith('api/stream-raw')) {
    // A slow, abortable download — like a real DVR clip of tens of MB.
    const signal = options && options.signal;
    if (window.__rawDelay) {
      await new Promise((resolve, reject) => {
        const t = setTimeout(resolve, window.__rawDelay);
        if (signal) signal.addEventListener('abort', () => {
          clearTimeout(t);
          window.__aborted.push(String(url));
          reject(new DOMException('aborted', 'AbortError'));
        });
      });
    }
    if (window.__nextRawResponse) return window.__nextRawResponse();
    return { ok: true, arrayBuffer: async () => new Uint8Array([1, 2, 3, 4]).buffer };
  }
  if (String(url).startsWith('api/stream/') || String(url).startsWith('api/download/')) {
    return { ok: true, status: 200, arrayBuffer: async () => new ArrayBuffer(0) };
  }
  throw new Error('unexpected fetch ' + url);
};

// A stub whose behaviour each case sets. Absent entirely for the "no wasm" case.
function installFFmpeg(behaviour) {
  window.FFmpegWASM = {
    FFmpeg: class {
      async load() { if (behaviour.loadThrows) throw new Error('core failed to load'); }
      async writeFile() {}
      async deleteFile() {}
      async exec() { return behaviour.exitCode === undefined ? 0 : behaviour.exitCode; }
      async readFile() {
        return behaviour.output === undefined ? new Uint8Array([0, 0, 0, 1]) : behaviour.output;
      }
    },
  };
}
</script>

<script src="/hikvision_recordings/www/app.js"></script>

<script>
const out = document.getElementById('log');
// NOTE: not `results` — app.js already binds that at top level, and a second
// top-level declaration of the same name is a SyntaxError that kills this script.
const checks = [];
function check(name, cond, detail) {
  checks.push({ name, pass: !!cond, detail: detail || '' });
  out.textContent += `${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}\n`;
}

const SMALL_CLIP = { id: 'abc123', size_bytes: 4 * 1024 * 1024, duration_s: 35 };
const HUGE_CLIP = { id: 'big999', size_bytes: 512 * 1024 * 1024, duration_s: 900 };
// Boundary clips for the doubled cap (64MB -> 128MB, v0.1.7).
const JUST_UNDER_NEW_CAP_CLIP = { id: 'cap065', size_bytes: 65 * 1024 * 1024, duration_s: 400 };
const JUST_OVER_NEW_CAP_CLIP = { id: 'cap129', size_bytes: 129 * 1024 * 1024, duration_s: 800 };

async function runCase({ clip, behaviour, raw, quality }) {
  window.__fetches = [];
  window.__nextRawResponse = raw || null;
  ffmpegPromise = null;                       // drop any cached core between cases
  if (behaviour === null) delete window.FFmpegWASM;
  else installFFmpeg(behaviour || {});

  const body = document.createElement('div');
  document.getElementById('cases').appendChild(body);
  buildPlayer(clip, body);

  const badge = body.querySelector('.mode-badge');
  const video = body.querySelector('video');
  for (let i = 0; i < 200 && (!badge.dataset.mode || badge.dataset.mode === 'working'); i++) {
    await new Promise((r) => setTimeout(r, 25));
  }
  if (quality) {
    window.__fetches = [];
    [...body.querySelectorAll('.quality button')]
      .find((b) => b.textContent === quality.toUpperCase()).click();
    for (let i = 0; i < 200 && badge.dataset.mode === 'working'; i++) {
      await new Promise((r) => setTimeout(r, 25));
    }
  }
  return {
    mode: badge.dataset.mode,
    title: badge.title,
    label: badge.textContent,
    src: video.getAttribute('src') || '',
    fetches: window.__fetches.slice(),
  };
}

(async function () {
  try {
    // 1. ffmpeg.wasm not present at all -> never attempt, never error.
    let r = await runCase({ clip: SMALL_CLIP, behaviour: null });
    check('no ffmpeg.wasm -> compatibility mode', r.mode === 'compat', r.mode);
    check('no ffmpeg.wasm -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);
    check('no ffmpeg.wasm -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));
    check('no ffmpeg.wasm -> badge says why', /not loaded/i.test(r.title), r.title);

    // 2. Clip too large for the wasm heap -> skip before loading the core.
    r = await runCase({ clip: HUGE_CLIP, behaviour: {} });
    check('oversized clip -> compatibility mode', r.mode === 'compat', r.mode);
    check('oversized clip -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));
    check('oversized clip -> badge cites the limit', /limit/i.test(r.title), r.title);

    // 3. Happy path.
    r = await runCase({ clip: SMALL_CLIP, behaviour: {} });
    check('working wasm -> fast mode', r.mode === 'fast', r.mode);
    check('working wasm -> plays a blob, not the server path',
          r.src.startsWith('blob:'), r.src);
    check('working wasm -> fetched raw bytes at sd by default',
          r.fetches.some((u) => u === 'api/stream-raw/abc123?quality=sd'), r.fetches.join(','));
    check('fast badge is legible in a screenshot', /fast/i.test(r.label), r.label);

    // 4. Core fails to load -> clean fallback.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { loadThrows: true } });
    check('core load throws -> compatibility mode', r.mode === 'compat', r.mode);
    check('core load throws -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 5. ffmpeg exits non-zero -> clean fallback.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { exitCode: 1 } });
    check('non-zero exit -> compatibility mode', r.mode === 'compat', r.mode);
    check('non-zero exit -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 6. Remux produces nothing -> must not hand the player an empty blob.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { output: new Uint8Array([]) } });
    check('empty output -> compatibility mode', r.mode === 'compat', r.mode);
    check('empty output -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 7. Raw endpoint errors (e.g. 503 busy) -> clean fallback carrying the reason.
    r = await runCase({
      clip: SMALL_CLIP,
      behaviour: {},
      raw: () => ({ ok: false, status: 503, json: async () => ({ detail: 'DVR is busy.' }) }),
    });
    check('raw 503 -> compatibility mode', r.mode === 'compat', r.mode);
    check('raw 503 -> badge carries the reason', /busy/i.test(r.title), r.title);

    // 7b. Doubled cap (v0.1.7): a 65MB clip is now under the 128MB cap -> fast mode.
    r = await runCase({ clip: JUST_UNDER_NEW_CAP_CLIP, behaviour: {} });
    check('65MB clip is under the doubled cap -> fast mode', r.mode === 'fast', r.mode);

    // 7c. A 129MB clip is still over the doubled cap -> compat, never fetched raw.
    r = await runCase({ clip: JUST_OVER_NEW_CAP_CLIP, behaviour: {} });
    check('129MB clip is over the doubled cap -> compatibility mode', r.mode === 'compat', r.mode);
    check('129MB clip -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));

    // 8. HD reaches the client path.
    r = await runCase({ clip: SMALL_CLIP, behaviour: {}, quality: 'hd' });
    check('hd -> fast mode', r.mode === 'fast', r.mode);
    check('hd -> raw fetched at hd',
          r.fetches.some((u) => u === 'api/stream-raw/abc123?quality=hd'), r.fetches.join(','));

    // 9. HD reaches the FALLBACK path too — quality must not be lost on the way down.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { exitCode: 1 }, quality: 'hd' });
    check('hd fallback -> compatibility mode', r.mode === 'compat', r.mode);
    check('hd fallback -> server path keeps quality=hd',
          r.src === 'api/stream/abc123?quality=hd', r.src);
    // ── v0.3.0 page: chips, timeline, one player, forward-in-time nav ─────────
    // These drive the page the way a user does — chips, Search, a tap on the
    // timeline or a row — rather than calling buildPlayer() directly, because the
    // entry points are what broke silently before (see git history for v0.1.x).
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(cond, tries = 200) {
      for (let i = 0; i < tries && !cond(); i++) await sleep(25);
      return cond();
    }
    // v0.5: All-recordings behaviour lives on #/all.
    location.hash = '#/all';
    await until(() => document.body.classList.contains('view-all') && !document.getElementById('view-all').hidden);

    const chip = (key) => document.querySelector(`#camera-chips [data-camera="${key}"]`);
    const recordingsFetches = () => window.__fetches.filter((u) => u.startsWith('api/recordings'));
    async function search() {
      const before = recordingsFetches().length;
      document.getElementById('search-form').requestSubmit();
      await until(() => recordingsFetches().length > before
                        && !document.getElementById('search-button').disabled);
      return recordingsFetches().slice(-1)[0] || '';
    }
    const iso = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };
    const clipAt = (id, key, name, kind, h, m, events) => ({
      id, channel: key, camera_key: key, channel_name: name, camera_name: name, kind,
      playback: kind === 'reolink' ? 'direct' : 'remux',
      start: iso(h, m), end: iso(h, m + 2), duration_s: 120,
      size_bytes: 4 * 1024 * 1024, has_sub: true,
      events: events || [],
    });
    // Newest first, exactly as the API sends them; two cameras interleaved in time.
    const P1 = clipAt('p1', 'reolink-0', 'Porch', 'reolink', 10, 0, ['person']);
    const D2 = clipAt('d2', 'dvr-101', 'Driveway', 'dvr', 10, 10, ['motion']);
    const P3 = clipAt('p3', 'reolink-0', 'Porch', 'reolink', 10, 20, ['vehicle']);
    window.__recordings = { clips: [P3, D2, P1], truncated: false, truncated_cameras: [], errors: [] };
    installFFmpeg({});
    ffmpegPromise = null;
    // Search the window that holds the fixture clips.
    dateInput.value = localDate(new Date(P1.start));
    fromInput.value = '09:30';
    toInput.value = '11:00';

    await until(() => chip('all'));
    check('chips: All plus one per camera',
          [...document.querySelectorAll('#camera-chips .chip')].map((c) => c.textContent).join(',')
            === 'All,Driveway,Porch,Garden',
          [...document.querySelectorAll('#camera-chips .chip')].map((c) => c.textContent).join(','));
    check('chips: All is selected by default', chip('all').getAttribute('aria-pressed') === 'true');

    let url = await search();
    check('All -> camera=all', url.includes('camera=all') && !url.includes('camera=dvr'), url);

    chip('reolink-0').click();
    check('picking a camera unselects All',
          chip('all').getAttribute('aria-pressed') === 'false'
          && chip('reolink-0').getAttribute('aria-pressed') === 'true');
    url = await search();
    check('one camera -> camera=reolink-0 only',
          url.includes('camera=reolink-0') && !url.includes('camera=all') && !url.includes('dvr-101'), url);
    check('camera selection is persisted',
          JSON.stringify(loadPref(STORE.cameras, null)) === '["reolink-0"]',
          JSON.stringify(loadPref(STORE.cameras, null)));
    chip('dvr-101').click();
    chip('reolink-1').click();
    check('picking every camera collapses back to All',
          chip('all').getAttribute('aria-pressed') === 'true');
    url = await search();
    check('… and searches camera=all', url.includes('camera=all'), url);

    // Timeline — one lane per camera in the selection (All → every configured camera).
    const lanes = [...document.querySelectorAll('#timeline .tl-row:not(.tl-axis)')];
    check('timeline: one lane per camera', lanes.length === 3, String(lanes.length));
    check('timeline: every clip drawn as a segment',
          document.querySelectorAll('#timeline .tl-seg').length === 3,
          String(document.querySelectorAll('#timeline .tl-seg').length));
    const porchLane = document.querySelector('#timeline .tl-row[data-camera="reolink-0"]');
    check('timeline: segments sit in their camera lane',
          porchLane && porchLane.querySelectorAll('.tl-seg').length === 2);
    const segP1 = document.querySelector('#timeline .tl-seg[data-clip-id="p1"]');
    const segP3 = document.querySelector('#timeline .tl-seg[data-clip-id="p3"]');
    check('timeline: later clip is further right',
          segP1 && segP3 && parseFloat(segP3.style.left) > parseFloat(segP1.style.left),
          `${segP1 && segP1.style.left} vs ${segP3 && segP3.style.left}`);

    // Tap a segment -> the single player opens on it.
    const panel = document.getElementById('player-panel');
    const pvideo = () => document.querySelector('#player-body video');
    const pbadge = () => document.querySelector('#player-body .mode-badge');
    const pdownload = () => document.querySelector('#player-body .download');
    const playing = () => (current ? current.clip.id : null);
    segP1.click();
    await until(() => pbadge() && pbadge().dataset.mode && pbadge().dataset.mode !== 'working');
    check('timeline tap opens the player panel', panel.hidden === false);
    check('timeline tap plays that clip', playing() === 'p1', playing());
    check('direct clip -> api/stream at sd, direct badge',
          pvideo().getAttribute('src') === 'api/stream/p1?quality=sd' && pbadge().dataset.mode === 'direct',
          `${pvideo().getAttribute('src')} ${pbadge().dataset.mode}`);
    check('one player, none in the list or timeline',
          document.querySelectorAll('#player-body video').length === 1
          && !document.querySelector('#results video, #timeline video'));
    check('playing clip is highlighted in timeline and list',
          segP1.classList.contains('active')
          && document.querySelector('#results [data-clip-id="p1"]').classList.contains('active'));

    // Forward in time, across cameras — NOT list order (the list is newest-first).
    const nextBtn = document.getElementById('next-clip');
    const prevBtn = document.getElementById('prev-clip');
    check('at the earliest clip, Earlier is disabled', prevBtn.disabled && !nextBtn.disabled);
    nextBtn.click();
    await until(() => pbadge() && pbadge().dataset.mode && pbadge().dataset.mode !== 'working');
    check('Later goes to the next clip in time, on the other camera', playing() === 'd2', playing());
    check('remux clip keeps the remux path (browser remux)', pbadge().dataset.mode === 'fast',
          pbadge().dataset.mode);
    nextBtn.click();
    await until(() => playing() === 'p3');
    check('Later again -> latest clip', playing() === 'p3', playing());
    check('at the latest clip, Later is disabled', nextBtn.disabled && !prevBtn.disabled);
    prevBtn.click();
    await until(() => playing() === 'd2');
    check('Earlier goes back in time', playing() === 'd2', playing());

    // Quality: switching updates Download and sticks for the next clip.
    await until(() => pbadge().dataset.mode !== 'working');
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'HD').click();
    check('HD -> Download follows quality',
          pdownload().getAttribute('href') === 'api/download/d2?quality=hd', pdownload().getAttribute('href'));
    await until(() => pbadge().dataset.mode !== 'working');
    nextBtn.click();
    await until(() => playing() === 'p3');
    check('chosen quality carries to the next clip',
          pdownload().getAttribute('href') === 'api/download/p3?quality=hd'
          && pvideo().getAttribute('src') === 'api/stream/p3?quality=hd',
          `${pdownload().getAttribute('href')} ${pvideo().getAttribute('src')}`);
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'SD').click();

    // Autoplay-next
    const autoplay = document.getElementById('autoplay');
    autoplay.checked = false;
    segP1.click();
    pvideo().dispatchEvent(new Event('ended'));
    await sleep(50);
    check('autoplay off: clip end stays put', playing() === 'p1', playing());
    autoplay.checked = true;
    autoplay.dispatchEvent(new Event('change'));
    pvideo().dispatchEvent(new Event('ended'));
    await until(() => playing() === 'd2');
    check('autoplay on: clip end plays the next later clip', playing() === 'd2', playing());
    check('autoplay is persisted', loadPref(STORE.autoplay, null) === true);
    autoplay.checked = false;
    autoplay.dispatchEvent(new Event('change'));
    await until(() => pbadge().dataset.mode !== 'working');

    // Keyboard
    const key = (target, k) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    key(fromInput, 'k');
    await sleep(30);
    check('keyboard ignored while typing in a field', playing() === 'd2', playing());
    key(document.body, 'k');
    await until(() => playing() === 'p3');
    check('k -> later clip', playing() === 'p3', playing());
    key(document.body, 'j');
    await until(() => playing() === 'd2');
    check('j -> earlier clip', playing() === 'd2', playing());
    await until(() => pbadge().dataset.mode !== 'working');

    // A list row opens the same player.
    document.querySelector('#results [data-clip-id="p3"] .clip-header').click();
    await until(() => playing() === 'p3');
    check('list row opens the clip in the player', playing() === 'p3', playing());
    check('still one player, none in the list',
          document.querySelectorAll('#player-body video').length === 1 && !document.querySelector('#results video'));

    // Close
    document.getElementById('player-close').click();
    check('close hides the player', panel.hidden === true && current === null);

    // Partial failure: per-camera banner, results still shown.
    window.__recordings = {
      clips: [P3, P1], truncated: true, truncated_cameras: ['reolink-0'],
      errors: [{ camera: 'dvr-101', detail: "Can't reach the DVR." }],
    };
    await search();
    const banners = [...document.querySelectorAll('#banners .banner')].map((b) => b.textContent);
    check('per-camera error banner names the camera',
          banners.length === 1 && banners[0].startsWith('Driveway:'), banners.join(' | '));
    check('partial failure still lists the other camera',
          document.querySelectorAll('#results .clip').length === 2);
    check('truncation notice names the camera', /Porch.*limit/.test(message.textContent), message.textContent);


    // ── Review fixes ───────────────────────────────────────────────────────────
    // M3: the backend mints FRESH ids on every search. Re-running the search while
    // a clip plays must keep its highlight and its place in time — including a
    // clip on another camera that starts the same second.
    window.__recordings = { clips: [P3, D2, P1], truncated: false, truncated_cameras: [], errors: [] };
    await search();
    document.querySelector('#timeline .tl-seg[data-clip-id="d2"]').click();
    await until(() => pbadge() && pbadge().dataset.mode === 'fast');
    const fresh = (c, id) => Object.assign({}, c, { id });
    const Q2 = clipAt('q2', 'reolink-0', 'Porch', 'reolink', 10, 10);   // same second as D2
    window.__recordings = {
      clips: [fresh(P3, 'p3x'), Q2, fresh(D2, 'd2x'), fresh(P1, 'p1x')],
      truncated: false, truncated_cameras: [], errors: [],
    };
    await search();
    check('re-search with fresh ids keeps the playing clip highlighted',
          document.querySelectorAll('#results .active, #timeline .active').length === 2,
          String(document.querySelectorAll('#results .active, #timeline .active').length));
    check('highlighted elements carry aria-current',
          document.querySelectorAll('[aria-current="true"]').length === 2);
    check('Earlier still enabled after re-search', !document.getElementById('prev-clip').disabled);
    nextBtn.click();
    await until(() => playing() === 'q2');
    check('Later after re-search: the same-second clip on the other camera is not skipped',
          playing() === 'q2', playing());

    // M2: a remux the user has moved on from is cancelled, and a queued one never
    // starts its download.
    window.__recordings = { clips: [P3, D2, P1], truncated: false, truncated_cameras: [], errors: [] };
    await search();
    window.__rawDelay = 300;
    window.__aborted = [];
    const rawBefore = window.__fetches.filter((u) => u.startsWith('api/stream-raw')).length;
    document.querySelector('#timeline .tl-seg[data-clip-id="d2"]').click();
    await sleep(30);
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'HD').click();
    await until(() => pbadge() && pbadge().dataset.mode === 'fast');
    const raws = window.__fetches.filter((u) => u.startsWith('api/stream-raw')).slice(rawBefore);
    check('quality switch mid-remux aborts the SD download',
          window.__aborted.includes('api/stream-raw/d2?quality=sd'), window.__aborted.join(','));
    check('… and the HD remux is what plays',
          raws.slice(-1)[0] === 'api/stream-raw/d2?quality=hd' && pvideo().getAttribute('src').startsWith('blob:'),
          raws.join(','));
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'SD').click();
    await until(() => pbadge() && pbadge().dataset.mode === 'fast');

    window.__aborted = [];
    document.getElementById('player-close').click();
    document.querySelector('#timeline .tl-seg[data-clip-id="d2"]').click();
    await sleep(30);
    document.getElementById('player-close').click();
    await sleep(400);
    check('closing mid-remux aborts the download', window.__aborted.length === 1, window.__aborted.join(','));
    // The shared <video> stays in the panel (never detached); close just disposes playback.
    check('… and nothing is left playing', panel.hidden && current === null);
    window.__rawDelay = 0;

    // Reused <video> stays attached between clips (fullscreen survives autoplay).
    segP1.isConnected || await search();
    document.querySelector('#timeline .tl-seg[data-clip-id="p1"]').click();
    const firstVideo = pvideo();
    let detached = false;
    const mo = new MutationObserver((recs) => {
      for (const r of recs) for (const n of r.removedNodes) if (n === firstVideo) detached = true;
    });
    mo.observe(document.getElementById('player-body'), { childList: true });
    nextBtn.click();
    await until(() => playing() === 'd2');
    await until(() => pbadge().dataset.mode !== 'working');
    mo.disconnect();
    check('the same <video> is reused and never detached between clips',
          pvideo() === firstVideo && !detached, `same=${pvideo() === firstVideo} detached=${detached}`);
    check('Download sits in the controls row',
          !!document.querySelector('#player-body .clip-controls .download'));

    // A failed search must not leave j/k pointing at clips no longer shown.
    window.__recordingsStatus = 500;
    await search();
    window.__recordingsStatus = 200;
    check('failed search: Earlier/Later disabled',
          document.getElementById('next-clip').disabled && document.getElementById('prev-clip').disabled);
    key(document.body, 'k');
    await sleep(30);
    check('failed search: k does nothing', playing() === 'd2', playing());
    check('failed search: message shown', /failed upstream/.test(message.textContent), message.textContent);

    // Paging the list: 200 rows, then Show more; the timeline draws everything.
    const many = [];
    for (let i = 0; i < 250; i++) many.push(clipAt(`m${i}`, 'reolink-0', 'Porch', 'reolink', 10, 0));
    window.__recordings = { clips: many, truncated: false, truncated_cameras: [], errors: [] };
    await search();
    const moreBtn = document.getElementById('show-more');
    check('first 200 rows only', document.querySelectorAll('#results .clip').length === 200,
          String(document.querySelectorAll('#results .clip').length));
    check('Show more appears', moreBtn.hidden === false);
    check('timeline draws all 250', document.querySelectorAll('#timeline .tl-seg').length === 250);
    moreBtn.click();
    check('Show more renders the rest', document.querySelectorAll('#results .clip').length === 250);
    check('Show more hides when done', moreBtn.hidden === true);

    // ── v0.5.0: routing, home, camera page, filters, snapshots, thumbs ────────
    const dayIso = (offsetDays, h, m) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      d.setHours(h, m, 0, 0);
      return d.toISOString();
    };
    const dayClip = (id, key, name, kind, offsetDays, h, m, events) => ({
      id, camera_key: key, channel: key, camera_name: name, channel_name: name, kind,
      playback: kind === 'reolink' ? 'direct' : 'remux',
      start: dayIso(offsetDays, h, m),
      end: dayIso(offsetDays, h, m + 1),
      duration_s: 60, size_bytes: 2 * 1024 * 1024, has_sub: true,
      events: events || ['motion'],
    });

    // Routing
    location.hash = '#/';
    await until(() => document.body.classList.contains('view-home'));
    check('route #/ shows home', !document.getElementById('view-home').hidden
          && document.getElementById('view-all').hidden
          && document.getElementById('view-camera').hidden);
    location.hash = '#/nope';
    await until(() => location.hash === '#/' || document.body.classList.contains('view-home'));
    await sleep(50);
    check('unknown hash redirects to home', document.body.classList.contains('view-home'));

    // Home: recent strip + tiles (snapshot vs thumbnail fallback)
    const recentA = dayClip('r1', 'reolink-0', 'Porch', 'reolink', 0, 12, 0, ['person']);
    const recentB = dayClip('r2', 'dvr-101', 'Driveway', 'dvr', 0, 11, 30, ['motion']);
    window.__recordings = { clips: [recentA, recentB], truncated: false, truncated_cameras: [], errors: [] };
    recentFetchedAt = 0;
    await fetchRecent(true);
    check('recent strip renders cards', document.querySelectorAll('#recent-strip .recent-card').length === 2,
          String(document.querySelectorAll('#recent-strip .recent-card').length));
    check('home tiles: one per camera', document.querySelectorAll('#camera-tiles .camera-tile').length === 3);
    check('home tiles: Garden shows error dot when device down',
          !!document.querySelector('#camera-tiles [data-camera="reolink-1"] .tile-error'));
    // Snapshot for Driveway (linked); Porch falls back to thumbnail src.
    window.__snapshotStatus = { 'dvr-101': 200 };
    await runSnapshotCycle();
    await sleep(50);
    check('home tile with snapshot:true gets a snapshot image',
          !!document.querySelector('#camera-tiles [data-camera="dvr-101"] .tile-img').src,
          document.querySelector('#camera-tiles [data-camera="dvr-101"] .tile-img').src);
    // style.css keeps .clip-thumb images at opacity 0 until .loaded — a src alone
    // still shows the placeholder (bug found in review, v0.5.0).
    check('home tile snapshot is made visible (.loaded on its media)',
          document.querySelector('#camera-tiles [data-camera="dvr-101"] .tile-media').classList.contains('loaded'));
    const porchImg = document.querySelector('#camera-tiles [data-camera="reolink-0"] .tile-img');
    check('home tile without snapshot uses thumbnail dataset',
          porchImg.dataset.src === 'api/thumbnail/r1', porchImg.dataset.src);

    // Snapshot polling pauses when hidden
    Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'hidden' });
    document.dispatchEvent(new Event('visibilitychange'));
    await sleep(30);
    check('snapshot polling pauses when document hidden', snapState.paused === true);
    Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'visible' });
    resumeSnapshots();
    await sleep(30);
    check('tap resumes snapshots after pause', snapState.paused === false);

    // Idle pause: force lastInteraction old
    lastInteraction = Date.now() - (3 * 60 * 1000);
    clearSnapTimer();
    scheduleSnapshots();
    await sleep(30);
    check('snapshot polling pauses after 2 min idle', snapState.paused === true);
    noteInteraction();
    await sleep(30);

    // Recent card → openClip sync + camera route
    const sharedVideoBefore = panelVideo;
    window.__recordingsFor = (u) => {
      // Camera day loads: return porch clips for today.
      if (u.includes('reolink-0')) {
        return { clips: [recentA, dayClip('r1b', 'reolink-0', 'Porch', 'reolink', 0, 10, 0, ['person'])],
                 truncated: false, truncated_cameras: [], errors: [] };
      }
      return { clips: [], truncated: false, truncated_cameras: [], errors: [] };
    };
    document.querySelector('#recent-strip .recent-card').click();
    await until(() => location.hash.startsWith('#/camera/reolink-0'));
    await until(() => document.body.classList.contains('view-camera') && document.querySelector('#vtimeline .vrow'));
    check('recent card navigates to camera route with ?t=',
          /#\/camera\/reolink-0\?t=/.test(location.hash), location.hash);
    check('recent card opens the clip (playing)', current && clipKey(current.clip) === clipKey(recentA),
          current && current.clip && current.clip.id);
    check('single <video> across views (same element)',
          !!current && current.player.video === sharedVideoBefore
          && document.querySelectorAll('#player-body video').length === 1,
          `same=${current && current.player.video === sharedVideoBefore} n=${document.querySelectorAll('#player-body video').length}`);

    // Camera page day load + date chip
    check('camera page loads today rows', document.querySelectorAll('#vtimeline .vrow').length >= 1);
    check('date chip shows Today', document.getElementById('date-chip').textContent === 'Today');

    // Event filters: multiple types → chips shown; nav skips filtered
    window.__recordingsFor = (u) => ({
      clips: [
        dayClip('f1', 'reolink-0', 'Porch', 'reolink', 0, 14, 0, ['person']),
        dayClip('f2', 'reolink-0', 'Porch', 'reolink', 0, 13, 0, ['vehicle']),
        dayClip('f3', 'reolink-0', 'Porch', 'reolink', 0, 12, 0, ['motion']),
      ],
      truncated: false, truncated_cameras: [], errors: [],
    });
    location.hash = '#/camera/reolink-0';
    await until(() => document.querySelector('#vtimeline .vrow'));
    await until(() => !document.getElementById('event-filters').hidden);
    check('event filters shown when >1 type', document.getElementById('event-filters').hidden === false);
    const personChip = [...document.querySelectorAll('#event-filters .chip')]
      .find((c) => c.textContent === 'Person');
    personChip.click();
    await sleep(30);
    check('filter hides non-matching cards',
          [...document.querySelectorAll('#vtimeline .vrow-card')].filter((c) => !c.hidden).length === 1);
    const personClip = camState.days.flatMap((d) => d.clips).find((c) => c.id === 'f1');
    openClip(personClip);
    await until(() => current && current.clip.id === 'f1');
    nextBtn.click();
    await sleep(80);
    check('Later skips filtered-out clips', current && current.clip.id === 'f1',
          current && current.clip && current.clip.id);
    // Absent persisted filter falls back to All
    savePref(STORE.filter('reolink-0'), 'doorbell');
    check('persisted absent type stored', loadPref(STORE.filter('reolink-0'), null) === 'doorbell',
          JSON.stringify(loadPref(STORE.filter('reolink-0'), null)));
    location.hash = '#/';
    await until(() => document.body.classList.contains('view-home') && !camState.key);
    const genBefore = camState.generation;
    location.hash = '#/camera/reolink-0';
    await until(() => camState.key === 'reolink-0' && camState.generation !== genBefore
                  && document.querySelector('#vtimeline .vrow'));
    check('absent persisted filter falls back to All', camState.filter === 'all', camState.filter);

    // Filters hidden when ≤1 type
    window.__recordingsFor = (u) => ({
      clips: [dayClip('m1', 'dvr-101', 'Driveway', 'dvr', 0, 9, 0, ['motion']),
              dayClip('m2', 'dvr-101', 'Driveway', 'dvr', 0, 8, 0, ['motion'])],
      truncated: false, truncated_cameras: [], errors: [],
    });
    location.hash = '#/camera/dvr-101';
    await until(() => document.querySelector('#vtimeline .vrow'));
    await sleep(50);
    renderEventFilters();
    check('event filters hidden when ≤1 type',
          document.getElementById('event-filters').hidden === true
          && typesInLoadedDays().length <= 1,
          `hidden=${document.getElementById('event-filters').hidden} types=${typesInLoadedDays().join(',')}`);

    // ● Live returns to snapshot
    openClip(camState.days[0].clips[0]);
    await until(() => current);
    document.getElementById('live-button').click();
    await sleep(40);
    check('● Live returns to snapshot stage', current === null
          && document.getElementById('stage-live').hidden === false
          && document.getElementById('live-button').hidden === true);

    // Infinite scroll stop rule (stubbed empty days) + failed day pauses
    let dayCalls = [];
    window.__recordingsFor = (u) => {
      const start = new URL('http://x/' + u).searchParams.get('start');
      dayCalls.push(start);
      const startMs = Date.parse(start);
      const today0 = new Date(); today0.setHours(0, 0, 0, 0);
      const daysBack = Math.round((today0 - new Date(startMs)) / 86400000);
      if (daysBack === 0) {
        return { clips: [dayClip('t0', 'dvr-101', 'Driveway', 'dvr', 0, 12, 0)], truncated: false, truncated_cameras: [], errors: [] };
      }
      if (daysBack === 1) {
        return Promise.reject ? { clips: [], truncated: false, truncated_cameras: [], errors: [] } : { clips: [] };
      }
      // Force a failure on day -2 via status by throwing through a sentinel
      if (daysBack === 2 && !window.__failDayDone) {
        window.__failDayDone = true;
        const err = { clips: [], detail: 'upstream' };
        // Simulate by returning ok body but we'll use a custom path — instead mark via __forceFail
      }
      return { clips: [], truncated: false, truncated_cameras: [], errors: [] };
    };
    // Proper failed-day: wrap fetch for one call
    window.__failDayDone = false;
    const origRecFor = window.__recordingsFor;
    let failOnce = true;
    window.__recordingsFor = (u) => {
      const start = new URLSearchParams(u.split('?')[1] || '').get('start');
      const startMs = Date.parse(start);
      const today0 = new Date(); today0.setHours(0, 0, 0, 0);
      const daysBack = Math.round((today0.getTime() - startOfLocalDay(new Date(startMs)).getTime()) / 86400000);
      dayCalls.push(daysBack);
      if (daysBack === 0) {
        return { clips: [dayClip('t0', 'dvr-101', 'Driveway', 'dvr', 0, 12, 0, ['motion', 'person'])],
                 truncated: false, truncated_cameras: [], errors: [] };
      }
      return { clips: [], truncated: false, truncated_cameras: [], errors: [] };
    };
    location.hash = '#/camera/dvr-101';
    await until(() => document.querySelector('#vtimeline .vrow'));
    // Manually load older empty days until stop
    for (let i = 0; i < 10; i++) {
      if (camState.stopped) break;
      await loadNextOlderDay();
    }
    check('infinite scroll stop after 7 consecutive empty days',
          camState.stopped === true && /No older recordings/.test(document.getElementById('camera-end').textContent || ''),
          `stopped=${camState.stopped} streak=${camState.emptyStreak}`);

    // Failed day pauses auto-load
    resetCameraState('dvr-101');
    window.__recordingsStatus = 200;
    const realFetch = window.fetch;
    let failDay = true;
    window.fetch = async (url, options) => {
      if (String(url).startsWith('api/recordings') && failDay) {
        const start = new URLSearchParams(String(url).split('?')[1] || '').get('start');
        const startMs = Date.parse(start);
        const today0 = new Date(); today0.setHours(0, 0, 0, 0);
        const daysBack = Math.round((today0.getTime() - startOfLocalDay(new Date(startMs)).getTime()) / 86400000);
        if (daysBack === 1) {
          failDay = false;
          return { ok: false, status: 502, json: async () => ({ detail: 'DVR unreachable' }) };
        }
      }
      return realFetch(url, options);
    };
    window.__recordingsFor = (u) => {
      const start = new URLSearchParams(u.split('?')[1] || '').get('start');
      const startMs = Date.parse(start);
      const today0 = new Date(); today0.setHours(0, 0, 0, 0);
      const daysBack = Math.round((today0.getTime() - startOfLocalDay(new Date(startMs)).getTime()) / 86400000);
      if (daysBack === 0) {
        return { clips: [dayClip('t0', 'dvr-101', 'Driveway', 'dvr', 0, 12, 0)], truncated: false, truncated_cameras: [], errors: [] };
      }
      return { clips: [], truncated: false, truncated_cameras: [], errors: [] };
    };
    await loadDay(startOfLocalDay(new Date()));
    await loadNextOlderDay(); // yesterday fails via patched fetch — but __recordingsFor short-circuits!
    // Bypass __recordingsFor for failure test
    window.__recordingsFor = null;
    resetCameraState('dvr-101');
    failDay = true;
    await loadDay(startOfLocalDay(new Date()));
    await loadDay(addLocalDays(startOfLocalDay(new Date()), -1));
    renderVTimeline();
    check('failed day pauses auto-load', camState.pausedAuto === true, String(camState.pausedAuto));
    check('failed day shows retry row', !!document.querySelector('.vday-error'), 'no retry row');
    window.fetch = realFetch;
    window.__recordingsFor = null;
    window.__recordingsStatus = 200;

    // Dedupe by clipKey across days (midnight-spanning clip listed for both days)
    resetCameraState('reolink-0');
    const spanStart = new Date(); spanStart.setHours(23, 50, 0, 0);
    const spanEnd = new Date(spanStart.getTime() + 20 * 60000);
    const spanning = {
      id: 'span1', camera_key: 'reolink-0', camera_name: 'Porch', kind: 'reolink', playback: 'direct',
      start: spanStart.toISOString(), end: spanEnd.toISOString(), duration_s: 1200,
      size_bytes: 1024, has_sub: true, events: ['motion'],
    };
    window.__recordingsFor = (u) => {
      const start = new URLSearchParams(u.split('?')[1] || '').get('start');
      const end = new URLSearchParams(u.split('?')[1] || '').get('end');
      // Both today and tomorrow-ish windows include the spanning clip
      return { clips: [spanning], truncated: false, truncated_cameras: [], errors: [] };
    };
    await loadDay(startOfLocalDay(new Date()));
    await loadDay(addLocalDays(startOfLocalDay(new Date()), 1)); // "tomorrow" won't apply; use yesterday + today
    // Load same clip via "yesterday" window that still returns it
    const beforeKeys = camState.seenKeys.size;
    await loadDay(addLocalDays(startOfLocalDay(new Date()), -1));
    // Second load of today should not duplicate
    const sizeBefore = camState.seenKeys.size;
    await loadDay(startOfLocalDay(new Date())); // already loaded — early return
    check('dedupe by clipKey across days', camState.seenKeys.size === 1, String(camState.seenKeys.size));
    renderVTimeline();
    check('spanning clip shown once', document.querySelectorAll(`#vtimeline .vrow[data-clip-id="span1"]`).length === 1,
          String(document.querySelectorAll(`#vtimeline .vrow[data-clip-id="span1"]`).length));

    // Earlier/Later across days
    const xd0 = dayClip('xd0', 'reolink-0', 'Porch', 'reolink', 0, 15, 0, ['person']);
    const xd1 = dayClip('xd1', 'reolink-0', 'Porch', 'reolink', -1, 15, 0, ['person']);
    window.__recordingsFor = (u) => {
      const start = new URLSearchParams(u.split('?')[1] || '').get('start');
      const day = localDate(new Date(start));
      if (day === localDate(new Date(xd0.start))) {
        return { clips: [xd0], truncated: false, truncated_cameras: [], errors: [] };
      }
      if (day === localDate(new Date(xd1.start))) {
        return { clips: [xd1], truncated: false, truncated_cameras: [], errors: [] };
      }
      return { clips: [], truncated: false, truncated_cameras: [], errors: [] };
    };
    location.hash = '#/';
    await until(() => document.body.classList.contains('view-home') && !camState.key);
    resetCameraState('reolink-0');
    await loadDay(startOfLocalDay(new Date(xd0.start)));
    await loadDay(startOfLocalDay(new Date(xd1.start)));
    renderEventFilters();
    renderVTimeline();
    const older = camState.days.flatMap((d) => d.clips).find((c) => c.id === 'xd1');
    const newer = camState.days.flatMap((d) => d.clips).find((c) => c.id === 'xd0');
    check('cross-day fixtures loaded', !!older && !!newer,
          `older=${older && older.id} newer=${newer && newer.id} days=${camState.days.map((d) => d.day + ':' + d.clips.length).join('|')}`);
    route = { name: 'camera', key: 'reolink-0' };
    if (older && newer) {
      openClip(older);
      await until(() => current && current.clip.id === 'xd1');
      nextBtn.click();
      await until(() => current && current.clip.id === 'xd0');
      check('Later crosses days', current && current.clip.id === 'xd0', current && current.clip && current.clip.id);
      prevBtn.click();
      await until(() => current && current.clip.id === 'xd1');
      check('Earlier crosses days', current && current.clip.id === 'xd1', current && current.clip && current.clip.id);
    } else {
      check('Later crosses days', false, 'missing fixtures');
      check('Earlier crosses days', false, 'missing fixtures');
    }

    // Date chip jump
    document.getElementById('date-jump').value = localDate(addLocalDays(new Date(), -1));
    document.getElementById('date-jump').dispatchEvent(new Event('change'));
    await until(() => document.querySelector(`.vday[data-day="${localDate(addLocalDays(new Date(), -1))}"]`));
    check('date chip jump loads that day',
          !!document.querySelector(`.vday[data-day="${localDate(addLocalDays(new Date(), -1))}"]`));

    // 410 retry by clipKey
    window.__recordingsFor = null;
    window.__recordings = { clips: [Object.assign({}, D2, { id: 'd2-fresh' })], truncated: false, truncated_cameras: [], errors: [] };
    let rawHits = 0;
    window.__nextRawResponse = () => {
      rawHits++;
      if (rawHits === 1) return { ok: false, status: 410, json: async () => ({ detail: 'gone' }) };
      return { ok: true, arrayBuffer: async () => new Uint8Array([1, 2, 3, 4]).buffer };
    };
    location.hash = '#/all';
    await until(() => document.body.classList.contains('view-all'));
    installFFmpeg({});
    ffmpegPromise = null;
    const body410 = document.createElement('div');
    document.getElementById('cases').appendChild(body410);
    const stale = Object.assign({}, D2, { id: 'd2-stale' });
    buildPlayer(stale, body410);
    await until(() => body410.querySelector('.mode-badge')
      && body410.querySelector('.mode-badge').dataset.mode
      && body410.querySelector('.mode-badge').dataset.mode !== 'working', 300);
    check('410 retry by clipKey succeeds on second id',
          body410.querySelector('.mode-badge').dataset.mode === 'fast' && rawHits >= 2,
          `mode=${body410.querySelector('.mode-badge').dataset.mode} hits=${rawHits}`);
    window.__nextRawResponse = null;

    // Thumbnail in-flight cap of 2
    window.__thumbDelay = 80;
    window.__thumbInflightPeak = 0;
    const peakBefore = 0;
    const box = document.createElement('div');
    document.getElementById('cases').appendChild(box);
    for (let i = 0; i < 6; i++) {
      const wrap = document.createElement('div');
      box.appendChild(wrap);
      attachThumb(wrap, { id: `th${i}`, camera_key: 'reolink-0', start: iso(10, i) });
      // Force enqueue without waiting for observer
      const img = wrap.querySelector('img');
      if (thumbObserver) thumbObserver.unobserve(img);
      enqueueThumb(img);
    }
    await sleep(40);
    check('thumbnail in-flight cap of 2', thumbInflight <= 2, String(thumbInflight));
    await sleep(500);
    window.__thumbDelay = 0;

  } catch (err) {
    check('harness ran without throwing', false, String(err && err.stack || err));
  }

  window.RESULT = {
    done: true,
    passed: checks.filter((c) => c.pass).length,
    failed: checks.filter((c) => !c.pass).length,
    failures: checks.filter((c) => !c.pass),
  };
})();
</script>
</body>
