<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>app.js playback fallback tests</title>
  <link rel="stylesheet" href="/hikvision_recordings/www/style.css">
</head>
<body class="view-all">
<!--
  Exercises the REAL hikvision_recordings/www/app.js — not a copy — against stubbed
  ffmpeg.wasm and fetch. What is being pinned:

    * the client path is skipped entirely (no raw fetch, no 32 MB core load) when
      it could never work: ffmpeg.wasm absent, or the clip too big for the heap
    * ANY client-side failure — load, HTTP, non-zero exit, empty output — lands on
      the existing server-side /api/stream, never on a dead player
    * the badge reports the path that actually ran, since that is the only way to
      tell them apart from a screenshot
    * the SD/HD choice reaches both paths, including the fallback

  Run via tests/frontend/run.py, which serves the repo and drives a real browser.
-->
<pre id="log"></pre>

<!-- The DOM app.js binds to at load. Ids must match www/index.html. -->
<nav><a href="#/" id="tab-cameras"></a><a href="#/all" id="tab-all"></a></nav>

      <span id="player-camera" class="player-camera"></span>

    </div>

  </div>

    <img id="stage-image" class="stage-image" alt="">

  </div>

  <div class="player-nav">
    <button type="button" id="prev-clip" class="nav-button"></button>
    <label class="toggle"><input type="checkbox" id="autoplay"> Autoplay</label>
    <button type="button" id="next-clip" class="nav-button"></button>
  </div>
</section>
<div id="cases"></div>

<script>
// ── stubs, installed before app.js runs ──────────────────────────────────────
window.__fetches = [];
window.__nextRawResponse = null;
window.__thumbInflightPeak = 0;
window.__snapshotStatus = {};  // cameraKey -> status (default 200)
window.__recordingsFor = null; // optional (url) => body override

// Preferences persist in the test browser profile — start every run clean.
try { localStorage.clear(); } catch (err) { /* ignore */ }

// Placeholder cameras only (privacy rule): never real names or addresses.
window.__recordings = { clips: [], truncated: false, truncated_cameras: [], errors: [] };

window.__aborted = [];
window.__rawDelay = 0;
window.__recordingsStatus = 200;
window.__recordingsDelay = 0;
window.__thumbDelay = 0;
window.__thumbStatus = 200;
window.__streamStatus = 200;
window.__downloadStatus = 200;

window.fetch = async (url, options) => {
  window.__fetches.push(String(url));
  const signal = options && options.signal;
  if (signal && signal.aborted) {
    throw new DOMException('aborted', 'AbortError');
  }
  if (String(url).startsWith('api/channels')) {
    return { ok: true, json: async () => [
      { id: 'dvr-101', key: 'dvr-101', name: 'Driveway', kind: 'dvr', snapshot: true },
      { id: 'reolink-0', key: 'reolink-0', name: 'Porch', kind: 'reolink', snapshot: false },
      { id: 'reolink-1', key: 'reolink-1', name: 'Garden', kind: 'reolink', snapshot: false },
    ] };
  }
  if (String(url).startsWith('api/health')) {
    return { ok: true, json: async () => ({
      dvr: 'ok',
      ha_api: 'ok',
      devices: [
        { prefix: 'dvr', kind: 'dvr', name: 'DVR', state: 'ok' },
        { prefix: 'reolink-0', kind: 'reolink', name: 'Porch', state: 'ok' },
        { prefix: 'reolink-1', kind: 'reolink', name: 'Garden', state: 'unreachable' },
      ],
    }) };
  }
  if (String(url).startsWith('api/recordings')) {
    if (window.__recordingsDelay) {
      await new Promise((resolve, reject) => {
        const t = setTimeout(resolve, window.__recordingsDelay);
        if (signal) signal.addEventListener('abort', () => {
          clearTimeout(t);
          window.__aborted.push(String(url));
          reject(new DOMException('aborted', 'AbortError'));
        });
      });
    }
    if (typeof window.__recordingsFor === 'function') {
      const body = window.__recordingsFor(String(url));
      return { ok: true, status: 200, json: async () => body };
    }
    const status = window.__recordingsStatus;
    return { ok: status < 400, status,
             json: async () => (status < 400 ? window.__recordings : { detail: 'Search failed upstream.' }) };
  }
  if (String(url).startsWith('api/snapshot/')) {
    const key = String(url).split('?')[0].slice('api/snapshot/'.length);
    const status = window.__snapshotStatus[key] ?? 200;
    if (status >= 400) return { ok: false, status, blob: async () => new Blob() };
    return { ok: true, status: 200, blob: async () => new Blob([new Uint8Array([1,2,3])], { type: 'image/jpeg' }) };
  }
  if (String(url).startsWith('api/thumbnail/')) {
    window.__thumbInflightPeak = Math.max(window.__thumbInflightPeak, thumbInflight || 0);
    if (window.__thumbDelay) await new Promise((r) => setTimeout(r, window.__thumbDelay));
    const status = window.__thumbStatus;
    if (status === 410) {
      window.__thumbStatus = 200;
      return { ok: false, status: 410, blob: async () => new Blob() };
    }
    if (status >= 400) return { ok: false, status, blob: async () => new Blob() };
    return { ok: true, status: 200, blob: async () => new Blob([new Uint8Array([9,9])], { type: 'image/jpeg' }) };
  }
  if (String(url).startsWith('api/stream-raw')) {
    // A slow, abortable download — like a real DVR clip of tens of MB.
    const signal = options && options.signal;
    if (window.__rawDelay) {
      await new Promise((resolve, reject) => {
        const t = setTimeout(resolve, window.__rawDelay);
        if (signal) signal.addEventListener('abort', () => {
          clearTimeout(t);
          window.__aborted.push(String(url));
          reject(new DOMException('aborted', 'AbortError'));
        });
      });
    }
    if (window.__nextRawResponse) return window.__nextRawResponse();
    return { ok: true, arrayBuffer: async () => new Uint8Array([1, 2, 3, 4]).buffer };
  }
  if (String(url).startsWith('api/stream/')) {
    const status = window.__streamStatus;
    return { ok: status < 400, status, arrayBuffer: async () => new ArrayBuffer(0) };
  }
  if (String(url).startsWith('api/download/')) {
    const status = window.__downloadStatus;
    return { ok: status < 400, status, arrayBuffer: async () => new ArrayBuffer(0) };
  }
  throw new Error('unexpected fetch ' + url);
};

// A stub whose behaviour each case sets. Absent entirely for the "no wasm" case.
function installFFmpeg(behaviour) {
  window.FFmpegWASM = {
    FFmpeg: class {
      async load() { if (behaviour.loadThrows) throw new Error('core failed to load'); }
      async writeFile() {}
      async deleteFile() {}
      async exec() { return behaviour.exitCode === undefined ? 0 : behaviour.exitCode; }
      async readFile() {
        return behaviour.output === undefined ? new Uint8Array([0, 0, 0, 1]) : behaviour.output;
      }
    },
  };
}
</script>

<script src="/hikvision_recordings/www/app.js"></script>

<script>
const out = document.getElementById('log');
// NOTE: not `results` — app.js already binds that at top level, and a second
// top-level declaration of the same name is a SyntaxError that kills this script.
const checks = [];
function check(name, cond, detail) {
  checks.push({ name, pass: !!cond, detail: detail || '' });
  out.textContent += `${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}\n`;
  window.__progress = name;
}

const SMALL_CLIP = { id: 'abc123', size_bytes: 4 * 1024 * 1024, duration_s: 35 };
const HUGE_CLIP = { id: 'big999', size_bytes: 512 * 1024 * 1024, duration_s: 900 };
// Boundary clips for the doubled cap (64MB -> 128MB, v0.1.7).
const JUST_UNDER_NEW_CAP_CLIP = { id: 'cap065', size_bytes: 65 * 1024 * 1024, duration_s: 400 };
const JUST_OVER_NEW_CAP_CLIP = { id: 'cap129', size_bytes: 129 * 1024 * 1024, duration_s: 800 };

async function runCase({ clip, behaviour, raw, quality }) {
  window.__fetches = [];
  window.__nextRawResponse = raw || null;
  ffmpegPromise = null;                       // drop any cached core between cases
  if (behaviour === null) delete window.FFmpegWASM;
  else installFFmpeg(behaviour || {});

  const body = document.createElement('div');
  document.getElementById('cases').appendChild(body);
  buildPlayer(clip, body);

  const badge = body.querySelector('.mode-badge');
  const video = body.querySelector('video');
  for (let i = 0; i < 200 && (!badge.dataset.mode || badge.dataset.mode === 'working'); i++) {
    await new Promise((r) => setTimeout(r, 25));
  }
  if (quality) {
    window.__fetches = [];
    [...body.querySelectorAll('.quality button')]
      .find((b) => b.textContent === quality.toUpperCase()).click();
    for (let i = 0; i < 200 && badge.dataset.mode === 'working'; i++) {
      await new Promise((r) => setTimeout(r, 25));
    }
  }
  return {
    mode: badge.dataset.mode,
    title: badge.title,
    label: badge.textContent,
    src: video.getAttribute('src') || '',
    fetches: window.__fetches.slice(),
  };
}

(async function () {
  try {
    // Lock narrow layout for regression tests (headless viewports can match the wide MQ).
    window.__forceWide = false;

    // 1. ffmpeg.wasm not present at all -> never attempt, never error.
    let r = await runCase({ clip: SMALL_CLIP, behaviour: null });
    check('no ffmpeg.wasm -> compatibility mode', r.mode === 'compat', r.mode);
    check('no ffmpeg.wasm -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);
    check('no ffmpeg.wasm -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));
    check('no ffmpeg.wasm -> badge says why', /not loaded/i.test(r.title), r.title);

    // 2. Clip too large for the wasm heap -> skip before loading the core.
    r = await runCase({ clip: HUGE_CLIP, behaviour: {} });
    check('oversized clip -> compatibility mode', r.mode === 'compat', r.mode);
    check('oversized clip -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));
    check('oversized clip -> badge cites the limit', /limit/i.test(r.title), r.title);

    // 3. Happy path.
    r = await runCase({ clip: SMALL_CLIP, behaviour: {} });
    check('working wasm -> fast mode', r.mode === 'fast', r.mode);
    check('working wasm -> plays a blob, not the server path',
          r.src.startsWith('blob:'), r.src);
    check('working wasm -> fetched raw bytes at sd by default',
          r.fetches.some((u) => u === 'api/stream-raw/abc123?quality=sd'), r.fetches.join(','));
    check('fast badge is legible in a screenshot', /fast/i.test(r.label), r.label);

    // 4. Core fails to load -> clean fallback.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { loadThrows: true } });
    check('core load throws -> compatibility mode', r.mode === 'compat', r.mode);
    check('core load throws -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 5. ffmpeg exits non-zero -> clean fallback.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { exitCode: 1 } });
    check('non-zero exit -> compatibility mode', r.mode === 'compat', r.mode);
    check('non-zero exit -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 6. Remux produces nothing -> must not hand the player an empty blob.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { output: new Uint8Array([]) } });
    check('empty output -> compatibility mode', r.mode === 'compat', r.mode);
    check('empty output -> plays via api/stream', r.src.startsWith('api/stream/'), r.src);

    // 7. Raw endpoint errors (e.g. 503 busy) -> clean fallback carrying the reason.
    r = await runCase({
      clip: SMALL_CLIP,
      behaviour: {},
      raw: () => ({ ok: false, status: 503, json: async () => ({ detail: 'DVR is busy.' }) }),
    });
    check('raw 503 -> compatibility mode', r.mode === 'compat', r.mode);
    check('raw 503 -> badge carries the reason', /busy/i.test(r.title), r.title);

    // 7b. Doubled cap (v0.1.7): a 65MB clip is now under the 128MB cap -> fast mode.
    r = await runCase({ clip: JUST_UNDER_NEW_CAP_CLIP, behaviour: {} });
    check('65MB clip is under the doubled cap -> fast mode', r.mode === 'fast', r.mode);

    // 7c. A 129MB clip is still over the doubled cap -> compat, never fetched raw.
    r = await runCase({ clip: JUST_OVER_NEW_CAP_CLIP, behaviour: {} });
    check('129MB clip is over the doubled cap -> compatibility mode', r.mode === 'compat', r.mode);
    check('129MB clip -> never fetched raw bytes',
          !r.fetches.some((u) => u.startsWith('api/stream-raw')), r.fetches.join(','));

    // 8. HD reaches the client path.
    r = await runCase({ clip: SMALL_CLIP, behaviour: {}, quality: 'hd' });
    check('hd -> fast mode', r.mode === 'fast', r.mode);
    check('hd -> raw fetched at hd',
          r.fetches.some((u) => u === 'api/stream-raw/abc123?quality=hd'), r.fetches.join(','));

    // 9. HD reaches the FALLBACK path too — quality must not be lost on the way down.
    r = await runCase({ clip: SMALL_CLIP, behaviour: { exitCode: 1 }, quality: 'hd' });
    check('hd fallback -> compatibility mode', r.mode === 'compat', r.mode);
    check('hd fallback -> server path keeps quality=hd',
          r.src === 'api/stream/abc123?quality=hd', r.src);
    // ── v0.3.0 page: chips, timeline, one player, forward-in-time nav ─────────
    // These drive the page the way a user does — chips, Search, a tap on the
    // timeline or a row — rather than calling buildPlayer() directly, because the
    // entry points are what broke silently before (see git history for v0.1.x).
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(cond, tries = 200) {
      for (let i = 0; i < tries && !cond(); i++) await sleep(25);
      return cond();
    }
    // v0.5: All-recordings behaviour lives on #/all.
    location.hash = '#/all';
    await until(() => document.body.classList.contains('view-all') && !document.getElementById('view-all').hidden);

    const chip = (key) => document.querySelector(`#camera-chips [data-camera="${key}"]`);
    const recordingsFetches = () => window.__fetches.filter((u) => u.startsWith('api/recordings'));
    async function search() {
      const before = recordingsFetches().length;
      document.getElementById('search-form').requestSubmit();
      await until(() => recordingsFetches().length > before
                        && !document.getElementById('search-button').disabled);
      return recordingsFetches().slice(-1)[0] || '';
    }
    const iso = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };
    const clipAt = (id, key, name, kind, h, m, events) => ({
      id, channel: key, camera_key: key, channel_name: name, camera_name: name, kind,
      playback: kind === 'reolink' ? 'direct' : 'remux',
      start: iso(h, m), end: iso(h, m + 2), duration_s: 120,
      size_bytes: 4 * 1024 * 1024, has_sub: true,
      events: events || [],
    });
    // Newest first, exactly as the API sends them; two cameras interleaved in time.
    const P1 = clipAt('p1', 'reolink-0', 'Porch', 'reolink', 10, 0, ['person']);
    const D2 = clipAt('d2', 'dvr-101', 'Driveway', 'dvr', 10, 10, ['motion']);
    const P3 = clipAt('p3', 'reolink-0', 'Porch', 'reolink', 10, 20, ['vehicle']);
    window.__recordings = { clips: [P3, D2, P1], truncated: false, truncated_cameras: [], errors: [] };
    installFFmpeg({});
    ffmpegPromise = null;
    // Search the window that holds the fixture clips.
    dateInput.value = localDate(new Date(P1.start));
    fromInput.value = '09:30';
    toInput.value = '11:00';

    await until(() => chip('all'));
    check('chips: All plus one per camera',
          [...document.querySelectorAll('#camera-chips .chip')].map((c) => c.textContent).join(',')
            === 'All,Driveway,Porch,Garden',
          [...document.querySelectorAll('#camera-chips .chip')].map((c) => c.textContent).join(','));
    check('chips: All is selected by default', chip('all').getAttribute('aria-pressed') === 'true');

    let url = await search();
    check('All -> camera=all', url.includes('camera=all') && !url.includes('camera=dvr'), url);

    chip('reolink-0').click();
    check('picking a camera unselects All',
          chip('all').getAttribute('aria-pressed') === 'false'
          && chip('reolink-0').getAttribute('aria-pressed') === 'true');
    url = await search();
    check('one camera -> camera=reolink-0 only',
          url.includes('camera=reolink-0') && !url.includes('camera=all') && !url.includes('dvr-101'), url);
    check('camera selection is persisted',
          JSON.stringify(loadPref(STORE.cameras, null)) === '["reolink-0"]',
          JSON.stringify(loadPref(STORE.cameras, null)));
    chip('dvr-101').click();
    chip('reolink-1').click();
    check('picking every camera collapses back to All',
          chip('all').getAttribute('aria-pressed') === 'true');
    url = await search();
    check('… and searches camera=all', url.includes('camera=all'), url);

    // Timeline — one lane per camera in the selection (All → every configured camera).
    const lanes = [...document.querySelectorAll('#timeline .tl-row:not(.tl-axis)')];
    check('timeline: one lane per camera', lanes.length === 3, String(lanes.length));
    check('timeline: every clip drawn as a segment',
          document.querySelectorAll('#timeline .tl-seg').length === 3,
          String(document.querySelectorAll('#timeline .tl-seg').length));
    const porchLane = document.querySelector('#timeline .tl-row[data-camera="reolink-0"]');
    check('timeline: segments sit in their camera lane',
          porchLane && porchLane.querySelectorAll('.tl-seg').length === 2);
    const segP1 = document.querySelector('#timeline .tl-seg[data-clip-id="p1"]');
    const segP3 = document.querySelector('#timeline .tl-seg[data-clip-id="p3"]');
    check('timeline: later clip is further right',
          segP1 && segP3 && parseFloat(segP3.style.left) > parseFloat(segP1.style.left),
          `${segP1 && segP1.style.left} vs ${segP3 && segP3.style.left}`);

    // Tap a segment -> the single player opens on it.
    const panel = document.getElementById('player-panel');
    const pvideo = () => document.querySelector('#player-body video');
    const pbadge = () => document.querySelector('#player-body .mode-badge');
    const pdownload = () => document.querySelector('#player-body .download');
    const playing = () => (current ? current.clip.id : null);
    segP1.click();
    await until(() => pbadge() && pbadge().dataset.mode && pbadge().dataset.mode !== 'working');
    check('timeline tap opens the player panel', panel.hidden === false);
    check('timeline tap plays that clip', playing() === 'p1', playing());
    check('direct clip -> api/stream at sd, direct badge',
          pvideo().getAttribute('src') === 'api/stream/p1?quality=sd' && pbadge().dataset.mode === 'direct',
          `${pvideo().getAttribute('src')} ${pbadge().dataset.mode}`);
    check('one player, none in the list or timeline',
          document.querySelectorAll('#player-body video').length === 1
          && !document.querySelector('#results video, #timeline video'));
    check('playing clip is highlighted in timeline and list',
          segP1.classList.contains('active')
          && document.querySelector('#results [data-clip-id="p1"]').classList.contains('active'));

    // Forward in time, across cameras — NOT list order (the list is newest-first).
    const nextBtn = document.getElementById('next-clip');
    const prevBtn = document.getElementById('prev-clip');
    check('at the earliest clip, Earlier is disabled', prevBtn.disabled && !nextBtn.disabled);
    nextBtn.click();
    await until(() => pbadge() && pbadge().dataset.mode && pbadge().dataset.mode !== 'working');
    check('Later goes to the next clip in time, on the other camera', playing() === 'd2', playing());
    check('remux clip keeps the remux path (browser remux)', pbadge().dataset.mode === 'fast',
          pbadge().dataset.mode);
    nextBtn.click();
    await until(() => playing() === 'p3');
    check('Later again -> latest clip', playing() === 'p3', playing());
    check('at the latest clip, Later is disabled', nextBtn.disabled && !prevBtn.disabled);
    prevBtn.click();
    await until(() => playing() === 'd2');
    check('Earlier goes back in time', playing() === 'd2', playing());

    // Quality: switching updates Download and sticks for the next clip.
    await until(() => pbadge().dataset.mode !== 'working');
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'HD').click();
    check('HD -> Download follows quality',
          pdownload().getAttribute('href') === 'api/download/d2?quality=hd', pdownload().getAttribute('href'));
    await until(() => pbadge().dataset.mode !== 'working');
    nextBtn.click();
    await until(() => playing() === 'p3');
    check('chosen quality carries to the next clip',
          pdownload().getAttribute('href') === 'api/download/p3?quality=hd'
          && pvideo().getAttribute('src') === 'api/stream/p3?quality=hd',
          `${pdownload().getAttribute('href')} ${pvideo().getAttribute('src')}`);
    [...document.querySelectorAll('#player-body .quality button')].find((b) => b.textContent === 'SD').click();

    // Autoplay-next
    const autoplay = document.getElementById('autoplay');
    autoplay.checked = false;
    segP1.click();
    pvideo().dispatchEvent(new Event('ended'));
    await sleep(50);
    check('autoplay off: clip end stays put', playing() === 'p1', playing());
    autoplay.checked = true;
    autoplay.dispatchEvent(new Event('change'));
    pvideo().dispatchEvent(new Event('ended'));
    await until(() => playing() === 'd2');
    check('autoplay on: clip end plays the next later clip', playing() === 'd2', playing());
    check('autoplay is persisted', loadPref(STORE.autoplay, null) === true);
    autoplay.checked = false;
    autoplay.dispatchEvent(new Event('change'));
    await until(() => pbadge().dataset.mode !== 'working');

    // Keyboard
    const key = (target, k) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    key(fromInput, 'k');
    await sleep(30);
    check('keyboard ignored while typing in a field', playing() === 'd2', playing());
    key(document.body, 'k');
    await until(() => playing() === 'p3');
    check('k -> later clip', playing() === 'p3', playing());
    key(document.body, 'j');
    await until(() => playing() === 'd2');
    check('j -> earlier clip', playing() === 'd2', playing());

            panelVideo === videoBefore && current === curBefore
            && document.body.classList.contains('layout-wide')
            && !!document.querySelector('#vtimeline.filmstrip .fs-card'),
            `wide=${document.body.classList.contains('layout-wide')}`);

      // Video box ≥55% of viewport height at 1280×720 in wide mode.
      const measureStyle = document.createElement('style');
      measureStyle.textContent = 'body.view-camera.layout-wide{height:720px!important;width:1280px!important;}';
      document.head.appendChild(measureStyle);
      document.body.classList.add('view-camera', 'layout-wide');
      playerPanel.hidden = false;
      showPlayingChrome();
      // Ensure video is in the panel for flex measurement.
      if (!panelVideo.isConnected) playerBody.appendChild(panelVideo);
      panelVideo.style.minHeight = '0';
      await sleep(40);
      const vh = 720;
      const videoBox = panelVideo.getBoundingClientRect().height
        || document.getElementById('stage-live').getBoundingClientRect().height;
      // Prefer the flex area of the player panel above the dock.
      const panelH = playerPanel.getBoundingClientRect().height;
      const dockH = document.querySelector('.camera-chrome').getBoundingClientRect().height;
      const toolbarH = document.querySelector('.camera-toolbar').getBoundingClientRect().height;
      const approxVideo = vh - dockH - toolbarH - 16; // body padding
      check('wide: video box ≥55% viewport height at 1280×720',
            (videoBox >= 0.55 * vh) || (approxVideo >= 0.55 * vh) || (panelH >= 0.55 * vh),
            `video=${videoBox} panel=${panelH} approx=${approxVideo} dock=${dockH}`);
      measureStyle.remove();

      // Restore narrow for any trailing checks.
      window.__forceWide = false;
      applyLayoutMode();
      if (current) closePlayer();
      location.hash = '#/';
      await until(() => document.body.classList.contains('view-home'));
    }

  } catch (err) {
    check('harness ran without throwing', false, String(err && err.stack || err));
  }

  window.RESULT = {
    done: true,
    passed: checks.filter((c) => c.pass).length,
    failed: checks.filter((c) => !c.pass).length,
    failures: checks.filter((c) => !c.pass),
  };
})();
</script>
</body>
</html>
