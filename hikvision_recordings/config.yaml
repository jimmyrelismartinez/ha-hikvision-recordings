name: DVR Recordings
version: "0.7.0"
slug: hikvision_recordings
description: Browse, play and download existing recordings from a Hikvision DVR/NVR and Reolink cameras
url: https://github.com/jimmyrelismartinez/ha-hikvision-recordings
arch:
  - aarch64
  - armv7
  - amd64
init: false
# /tmp becomes a RAM filesystem. Clips are staged there so playback responses can
# answer Range requests (iOS will not play a video without it) — and staging in RAM
# is what keeps the zero-persistence guarantee intact. Do not remove.
tmpfs: true
ingress: true
ingress_port: 8099
# Lets the add-on call HA's camera_proxy for near-live snapshots (SUPERVISOR_TOKEN).
homeassistant_api: true
panel_icon: mdi:cctv
panel_title: Recordings
panel_admin: false
# Link listener (v0.7). null = unmapped until the user sets a host port in the
# add-on Network tab. Even when unmapped, 8100 is reachable from other containers
# on the hassio network — that is acceptable because fetches are token-gated.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: External playback links (signed clip URLs). Leave unmapped unless a LAN player needs them.
options:
  dvr_host: ""
  dvr_port: 80
  dvr_username: ""
  dvr_password: ""
  dvr_use_https: false
  dvr_time_mode: auto
  channels:
    - id: 101
      name: Camera 1
  max_results: 40
  max_concurrent_downloads: 2
  max_stage_mb: 256
  client_remux_max_mb: 128
  max_search_results: 500
  # Standalone Reolink cameras recording to their own SD card (HTTP API, not ISAPI).
  # One row each: name, host, username, password; optional port (80), use_https,
  # verify_ssl, channel (0). Leave empty if you only have the DVR.
  reolink_cameras: []
  log_level: info
  # Short-lived signed clip URLs for LAN players (off by default).
  external_links: false
  external_mint_token: ""
  external_link_ttl_s: 300
  external_base_url: ""
schema:
  # dvr_* may be left blank when at least one Reolink camera is configured.
  dvr_host: str?
  dvr_port: port
  dvr_username: str?
  dvr_password: password?
  dvr_use_https: bool
  dvr_time_mode: list(auto|utc|local|declared)
  channels:
    - id: int
      name: str
      ha_camera: "match(^camera\\.[a-z0-9_]{1,64}$)?"
  max_results: int(1,200)
  max_concurrent_downloads: int(1,4)
  max_stage_mb: int(16,1024)
  client_remux_max_mb: int(16,512)
  max_search_results: int(40,2000)
  reolink_cameras:
    - name: str
      host: str
      username: str
      password: password
      port: port?
      use_https: bool?
      verify_ssl: bool?
      channel: int?
      ha_camera: "match(^camera\\.[a-z0-9_]{1,64}$)?"
  log_level: list(trace|debug|info|warning|error|critical)
  external_links: bool
  external_mint_token: password?
  external_link_ttl_s: int(60,900)
  external_base_url: str?
